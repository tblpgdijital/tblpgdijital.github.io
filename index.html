<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002b49">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dijital Merkez">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/icon-192.png">
  <title>TUI BLUE Palm Garden Dijital Yönetim Merkezi</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef7fc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #appFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#eef7fc}
    .shellBtn{
      position:fixed;right:12px;z-index:50000;border:0;border-radius:999px;
      padding:11px 14px;font-weight:850;font-size:12px;color:#fff;cursor:pointer;
      box-shadow:0 10px 28px rgba(0,60,100,.24);display:none;align-items:center;gap:7px
    }
    #pushBtn{bottom:84px;background:linear-gradient(135deg,#066ca6,#0793ca)}
    #installBtn{bottom:24px;background:linear-gradient(135deg,#003a61,#0871a9)}
    .shellBtn.show{display:flex}
    #tip{
      position:fixed;left:10px;right:10px;bottom:86px;z-index:50001;
      background:#fff;border:1px solid #d4e3ec;border-radius:18px;padding:14px 42px 14px 14px;
      box-shadow:0 16px 44px rgba(0,55,90,.18);font-size:12px;line-height:1.5;color:#24475d;display:none
    }
    #tipClose{position:absolute;right:8px;top:7px;width:28px;height:28px;border:0;border-radius:9px;background:#eef4f8;color:#355b70}
    #status{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:50002;background:#003a61;color:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800;display:none}
    @media(display-mode:standalone){#installBtn{display:none!important}}
    @media(max-width:700px){
      #pushBtn{bottom:90px;right:12px}
      #installBtn{bottom:18px;right:12px}
    }
  </style>
</head>
<body>
  <iframe id="appFrame" title="TUI BLUE Palm Garden Dijital Yönetim Merkezi"
    allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; autoplay" allowfullscreen></iframe>

  <button id="pushBtn" class="shellBtn" type="button">🔔 Bildirimleri Aç</button>
  <button id="installBtn" class="shellBtn" type="button">⬇ Ana Ekrana Yükle</button>
  <div id="tip"><button id="tipClose" type="button">×</button>
    iPhone/iPad: Safari'de <b>Paylaş → Ana Ekrana Ekle</b> seçeneğini kullanın.
  </div>
  <div id="status"></div>

<script>
(() => {
  'use strict';

  const APP_URL = 'https://script.google.com/macros/s/AKfycbyXiDd0gtdLwH0LWwo4C77PpDQmM8iDTA0B9u-ZrHy0AAT6DOx2OEDEAtyPPJ0UI2Y/exec';
  const ONESIGNAL_APP_ID = '42b7220b-661b-45f3-907c-e54b9ea99aec';
  const PWA_STATUS_API = APP_URL;

  const frame = document.getElementById('appFrame');
  const pushBtn = document.getElementById('pushBtn');
  const installBtn = document.getElementById('installBtn');
  const tip = document.getElementById('tip');

  let deferredPrompt = null;
  let oneSignalApi = null;
  let pendingUser = null;
  let currentEducationId = '';

  function isPhone(){
    const ua=navigator.userAgent||'';
    const phoneUA=/iPhone|iPod|Android.*Mobile|Windows Phone/i.test(ua);
    return phoneUA || window.matchMedia('(max-width:700px)').matches;
  }

  function appUrlForDevice(){
    return APP_URL + (isPhone() ? '?view=mobile' : '');
  }

  frame.src = appUrlForDevice();

  function isIOS(){
    return /iPad|iPhone|iPod/i.test(navigator.userAgent) ||
      (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  }

  function isStandalone(){
    return window.matchMedia('(display-mode:standalone)').matches ||
      window.navigator.standalone===true;
  }

  function status(msg,ms=3200){
    const el=document.getElementById('status');
    el.textContent=msg; el.style.display='block';
    clearTimeout(status.t);
    status.t=setTimeout(()=>el.style.display='none',ms);
  }

  function deviceId(){
    const key='tbpg_device_id_v1';
    let id=localStorage.getItem(key);
    if(!id){
      id=(crypto&&crypto.randomUUID)?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random().toString(36).slice(2);
      localStorage.setItem(key,id);
    }
    return id;
  }

  function platformName(){
    const ua=navigator.userAgent||'';
    if(/iPad|iPhone|iPod/i.test(ua))return 'iOS';
    if(/Android/i.test(ua))return 'Android';
    if(/Windows/i.test(ua))return 'Windows';
    if(/Macintosh|Mac OS X/i.test(ua))return 'macOS';
    return 'Diğer';
  }

  function subscriptionId(){
    try{return String(oneSignalApi?.User?.PushSubscription?.id||'')}catch(_){return ''}
  }

  function ping(payload){
    if(!payload?.educationId)return Promise.resolve(false);
    const cb='tbpgPwaCb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const qs=new URLSearchParams({
      api:'pwaPing',callback:cb,educationId:String(payload.educationId||''),app:'DIJITAL',
      deviceId:deviceId(),installed:isStandalone()?'1':'0',
      permission:('Notification'in window?Notification.permission:'unsupported'),
      subscriptionId:subscriptionId(),platform:platformName(),
      userAgent:String(navigator.userAgent||'').slice(0,380)
    });
    return new Promise(resolve=>{
      const s=document.createElement('script');
      const timer=setTimeout(()=>finish(false),9000);
      function finish(v){clearTimeout(timer);try{delete window[cb]}catch(_){}s.remove();resolve(v)}
      window[cb]=r=>finish(!!r?.ok);
      s.onerror=()=>finish(false);
      s.src=PWA_STATUS_API+'?'+qs.toString();
      document.head.appendChild(s);
    });
  }

  function refreshPushButton(){
    if(!('Notification'in window) || !('serviceWorker'in navigator))return;
    if(isIOS()&&!isStandalone()){pushBtn.classList.remove('show');return}
    if(Notification.permission==='granted')pushBtn.classList.remove('show');
    else pushBtn.classList.add('show');
  }

  async function bindUser(payload){
    if(!payload?.educationId)return;
    pendingUser=payload;
    currentEducationId=String(payload.educationId).trim();
    if(!oneSignalApi)return;
    try{
      await oneSignalApi.login(currentEducationId);
      await oneSignalApi.User.addTags({
        portal_dijital:'1',
        pwa_dijital:isStandalone()?'1':'0',
        dijital_departman:String(payload.department||''),
        dijital_rol:String(payload.role||'')
      });
      await ping(payload);
    }catch(e){console.warn(e)}
    refreshPushButton();
  }

  async function requestPush(){
    if(isIOS()&&!isStandalone()){
      tip.style.display='block';
      status('Önce Ana Ekrana ekleyin');
      return;
    }
    if(!oneSignalApi){status('Bildirim sistemi hazırlanıyor');return}
    if(currentEducationId)await oneSignalApi.login(currentEducationId);
    try{
      await oneSignalApi.Notifications.requestPermission();
      if(Notification.permission==='granted'){
        try{await oneSignalApi.User.PushSubscription.optIn()}catch(_){}
        if(pendingUser)await ping(pendingUser);
        status('Bildirimler açıldı ✓');
      }
    }catch(e){status('Bildirim izni açılamadı')}
    refreshPushButton();
  }

  window.OneSignalDeferred=window.OneSignalDeferred||[];
  window.OneSignalDeferred.push(async OneSignal=>{
    oneSignalApi=OneSignal;
    try{
      await OneSignal.init({
        appId:ONESIGNAL_APP_ID,
        serviceWorkerPath:'/OneSignalSDKWorker.js',
        serviceWorkerParam:{scope:'/'},
        autoResubscribe:true
      });
      if(pendingUser)await bindUser(pendingUser);
    }catch(e){console.warn('OneSignal init',e)}
    refreshPushButton();
  });

  window.addEventListener('message',async e=>{
    if(e.source!==frame.contentWindow)return;
    const d=e.data||{};
    if(d.type==='TBPG_DIGITAL_USER')await bindUser(d);
    if(d.type==='TBPG_REQUEST_PUSH')await requestPush();
  });

  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault(); deferredPrompt=e;
    if(!isStandalone())installBtn.classList.add('show');
  });

  window.addEventListener('appinstalled',async()=>{
    installBtn.classList.remove('show');
    status('Dijital Yönetim Merkezi yüklendi ✓');
    if(pendingUser)await ping(pendingUser);
  });

  installBtn.addEventListener('click',async()=>{
    if(isIOS()){
      tip.style.display='block';
      return;
    }
    if(!deferredPrompt){
      status('Tarayıcı menüsünden “Uygulamayı yükle” seçeneğini kullanın.',5000);
      return;
    }
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
  });

  pushBtn.addEventListener('click',requestPush);
  document.getElementById('tipClose').addEventListener('click',()=>tip.style.display='none');

  if(isIOS()&&!isStandalone())installBtn.classList.add('show');
  refreshPushButton();
})();
</script>
</body>
</html>
